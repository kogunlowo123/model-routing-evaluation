replicaCount: 3

image:
  repository: ghcr.io/kogunlowo123/model-routing-evaluation
  tag: ""  # defaults to .Chart.AppVersion
  digest: ""  # set to pin an immutable sha256 digest; takes precedence over tag
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: model-routing-evaluation
  # Cloud workload identity bindings (outputs of deployments/terraform/<cloud>):
  #   azure.workload.identity/client-id   (Azure Workload ID; also set
  #                                        podLabels azure.workload.identity/use: "true")
  #   eks.amazonaws.com/role-arn          (AWS IRSA)
  #   iam.gke.io/gcp-service-account      (GKE Workload Identity)
  annotations: {}

podLabels: {}

# Deployment-specific values marked REQUIRED have no default; the chart
# refuses to render until they are set (helm install --values <env>.yaml).
mre:
  environment: production
  publicUrl: ""  # REQUIRED: external HTTPS base URL (A2A agent card url)
  # Authorization of agent callers: set fabricUrl (agent-identity-fabric) OR
  # all three agentAuth values for local verification against an issuer JWKS.
  fabricUrl: ""
  agentAuth:
    issuer: ""
    audience: ""
    jwksUrl: ""
  approver:
    issuer: ""  # REQUIRED: enterprise OIDC issuer for approvers and auditors
    audience: ""  # REQUIRED: audience of approver tokens
    jwksUrl: ""  # REQUIRED: JWKS URL of the enterprise OIDC issuer
    rolesClaim: roles
    approverRole: model-governance-approver
    auditorRole: model-governance-auditor
  shadowDailyBudgetUsd: "0"  # shadow spend cap per UTC day; 0 disables shadow evaluation
  evaluationConcurrency: 4
  minJudgeKappa: "0.6"
  minCalibrationItems: 30
  mcpAllowedHosts: []  # Host headers accepted on /mcp; empty disables the check
  logLevel: INFO
  otlpEndpoint: ""  # optional OTLP gRPC endpoint

# Non-secret provider facts referenced by configs/providers.yaml and
# configs/compliance.yaml. Prices are contracted USD per million tokens;
# baa / zeroRetention must be set explicitly (true or false) to what the
# signed agreements state. API keys come from secrets.providerKeys.
providers:
  azureOpenAI:
    endpoint: ""  # REQUIRED: https://<account>.openai.azure.com
    deployment: ""  # REQUIRED: model deployment name
    region: ""  # REQUIRED
    jurisdiction: ""  # REQUIRED: e.g. US, EU
    baa: null  # REQUIRED: true/false
    zeroRetention: null  # REQUIRED: true/false
    inputUsdPerMtok: ""  # REQUIRED
    outputUsdPerMtok: ""  # REQUIRED
  azureAIFoundry:  # Phi and Llama
    endpoint: ""  # REQUIRED: https://<resource>.services.ai.azure.com
    region: ""  # REQUIRED
    jurisdiction: ""  # REQUIRED
    baa: null  # REQUIRED
    zeroRetention: null  # REQUIRED
    phiInputUsdPerMtok: ""  # REQUIRED
    phiOutputUsdPerMtok: ""  # REQUIRED
    llamaInputUsdPerMtok: ""  # REQUIRED
    llamaOutputUsdPerMtok: ""  # REQUIRED
  anthropic:
    region: ""  # REQUIRED: processing region stated by the agreement
    jurisdiction: ""  # REQUIRED
    baa: null  # REQUIRED
    zeroRetention: null  # REQUIRED
    inputUsdPerMtok: ""  # REQUIRED
    outputUsdPerMtok: ""  # REQUIRED
  gemini:
    region: ""  # REQUIRED
    jurisdiction: ""  # REQUIRED
    baa: null  # REQUIRED
    zeroRetention: null  # REQUIRED
    inputUsdPerMtok: ""  # REQUIRED
    outputUsdPerMtok: ""  # REQUIRED
  bedrock:  # Nova
    awsRegion: ""  # REQUIRED
    jurisdiction: ""  # REQUIRED
    baa: null  # REQUIRED
    zeroRetention: null  # REQUIRED
    inputUsdPerMtok: ""  # REQUIRED
    outputUsdPerMtok: ""  # REQUIRED
    # Cross-cloud workload identity: IAM role (deployments/terraform/aws output)
    # assumed with a projected service-account token. Leave empty on EKS where
    # IRSA injects credentials through the service-account annotation.
    roleArn: ""
    tokenAudience: sts.amazonaws.com

# Secrets are created by the platform secret operator (External Secrets,
# Secrets Store CSI) from the cloud secret manager provisioned by Terraform.
secrets:
  # Secret holding key DATABASE_URL (postgresql+asyncpg://...).
  database: model-routing-evaluation-database
  # Secret holding AZURE_OPENAI_API_KEY, AZURE_AI_FOUNDRY_API_KEY,
  # ANTHROPIC_API_KEY and GEMINI_API_KEY.
  providerKeys: model-routing-evaluation-provider-keys
  # Secret holding the Ed25519 audit signing key as <auditKeyFile>.
  auditKey: model-routing-evaluation-audit-key
  auditKeyFile: ""  # REQUIRED: file name of the audit key within secrets.auditKey

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""  # required when ingress.enabled
  tlsSecret: model-routing-evaluation-tls
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  # Namespaces whose pods may call the service.
  allowedNamespaceLabels:
    agent-platform/member: "true"
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: observability
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx

serviceMonitor:
  enabled: false
  interval: 30s

nodeSelector: {}
tolerations: []
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
