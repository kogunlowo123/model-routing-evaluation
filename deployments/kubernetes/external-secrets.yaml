# Syncs service secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates; provider API key values are
# written to the secret manager by the platform team, never by Terraform.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: model-routing-evaluation-database
  namespace: model-routing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: model-routing-evaluation-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: model-routing-evaluation-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: model-routing-evaluation-provider-keys
  namespace: model-routing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: model-routing-evaluation-provider-keys
    creationPolicy: Owner
  data:
    - secretKey: AZURE_OPENAI_API_KEY
      remoteRef:
        key: model-routing-evaluation-azure-openai-api-key
    - secretKey: AZURE_AI_FOUNDRY_API_KEY
      remoteRef:
        key: model-routing-evaluation-azure-ai-foundry-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: model-routing-evaluation-anthropic-api-key
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: model-routing-evaluation-gemini-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: model-routing-evaluation-audit-key
  namespace: model-routing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: model-routing-evaluation-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^model-routing-evaluation-audit-key-"
      rewrite:
        - regexp:
            source: "^model-routing-evaluation-audit-key-(.*)$"
            target: "audit-$1.pem"
